name: Fourth Dimension Article Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Suggest five topics, generate the selected article, or prepare approved drafts"
        required: true
        default: suggest_topics
        type: choice
        options:
          - suggest_topics
          - generate_selected_article
          - publish-approved
      topic:
        description: "Selected topic/direction; required only for generate_selected_article"
        required: false
        type: string

permissions:
  contents: read

jobs:
  article-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/article-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/article-agent/package-lock.json
      - run: npm ci
      - run: npm run check
      - name: Suggest or generate article
        if: inputs.mode != 'publish-approved'
        run: npm start
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_CONNECTED_ACCOUNT_ID: ${{ secrets.GEMINI_CONNECTED_ACCOUNT_ID }}
          GOOGLE_SHEETS_CONNECTED_ACCOUNT_ID: ca_fEO9enPOPqOL
          GOOGLE_DRIVE_CONNECTED_ACCOUNT_ID: ca_cRddrVMnbMXp
          GOOGLE_SEARCH_CONSOLE_CONNECTED_ACCOUNT_ID: ${{ secrets.GOOGLE_SEARCH_CONSOLE_CONNECTED_ACCOUNT_ID }}
          SEARCH_CONSOLE_SITE_URL: ${{ secrets.SEARCH_CONSOLE_SITE_URL }}
          ARTICLE_SPREADSHEET_ID: 1heSkaWrqIRfKxJnHvWP-kYdK9YbZEak07lSPuVyjO44
          ARTICLE_SHEET_NAME: Article Pipeline
          ARTICLE_MODE: ${{ inputs.mode }}
          ARTICLE_TOPIC: ${{ inputs.topic }}
          ARTICLE_DRY_RUN: "false"
          ARTICLE_GENERATE_IMAGES: "true"
          ARTICLE_REQUIRE_IMAGES: "true"
          ARTICLE_IMAGES_PER_ARTICLE: "4"
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
      - name: Create WordPress drafts for approved articles
        if: inputs.mode == 'publish-approved'
        run: npm run publish-approved
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          GOOGLE_SHEETS_CONNECTED_ACCOUNT_ID: ca_fEO9enPOPqOL
          ARTICLE_SPREADSHEET_ID: 1heSkaWrqIRfKxJnHvWP-kYdK9YbZEak07lSPuVyjO44
          ARTICLE_SHEET_NAME: Article Pipeline
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          EDITORIAL_AUTHOR: Fourth Dimension Studio Editorial Team
          ARTICLE_REQUIRE_IMAGES: "true"
