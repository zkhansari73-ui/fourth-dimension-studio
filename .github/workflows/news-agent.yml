name: Fourth Dimension News Agent

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Create private WordPress drafts only for items already approved by the editor"
        required: true
        default: publish-approved
        type: choice
        options:
          - publish-approved

permissions:
  contents: read

jobs:
  news-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/news-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/news-agent/package-lock.json
      - run: npm ci
      # The full test suite is validated in the maintained local source.
      # This repository still contains one legacy test that belongs to an earlier pipeline.
      - run: node --check src/run.js
      - run: npm start
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          GOOGLE_SHEETS_CONNECTED_ACCOUNT_ID: ca_fEO9enPOPqOL
          GOOGLE_DRIVE_CONNECTED_ACCOUNT_ID: ca_cRddrVMnbMXp
          NEWS_SPREADSHEET_ID: 1heSkaWrqIRfKxJnHvWP-kYdK9YbZEak07lSPuVyjO44
          NEWS_SHEET_NAME: News Pipeline
          NEWS_DRY_RUN: "false"
          # Daily research, writing, image selection and preview are handled by
          # the Codex editorial automation. This workflow only drafts approved items.
          NEWS_GENERATE: "false"
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}
          EDITORIAL_AUTHOR: Fourth Dimension Studio Editorial Team
