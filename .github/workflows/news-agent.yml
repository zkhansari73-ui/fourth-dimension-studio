name: Fourth Dimension News Agent

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  news-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/news-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/news-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm start
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          GEMINI_CONNECTED_ACCOUNT_ID: ${{ secrets.GEMINI_CONNECTED_ACCOUNT_ID }}
          GOOGLE_SHEETS_CONNECTED_ACCOUNT_ID: ca_fEO9enPOPqOL
          SITE_SITEMAP_URL: https://fourth-dimension-studio.infinityfreeapp.com/sitemap.xml
          NEWS_SPREADSHEET_ID: 1heSkaWrqIRfKxJnHvWP-kYdK9YbZEak07lSPuVyjO44
          NEWS_INBOX_SHEET_NAME: News Inbox
          NEWS_DRY_RUN: "false"
          NEWS_SCOUT_ENABLED: "true"
          NEWS_MIN_TOTAL_SCORE: "70"

