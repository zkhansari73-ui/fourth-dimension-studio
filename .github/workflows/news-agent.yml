name: Fourth Dimension News Agent

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Choose publish-approved to save Gemini usage"
        required: true
        default: publish-approved
        type: choice
        options:
          - publish-approved
          - full

permissions:
  contents: read

jobs:
  news-agent:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: automation/news-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: automation/news-agent/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm start
        env:
          COMPOSIO_API_KEY: ${{ secrets.COMPOSIO_API_KEY }}
          COMPOSIO_USER_ID: ${{ secrets.COMPOSIO_USER_ID }}
          GEMINI_CONNECTED_ACCOUNT_ID: ${{ secrets.GEMINI_CONNECTED_ACCOUNT_ID }}
          GOOGLE_SHEETS_CONNECTED_ACCOUNT_ID: ca_fEO9enPOPqOL
          GOOGLE_DRIVE_CONNECTED_ACCOUNT_ID: ca_cRddrVMnbMXp
          NEWS_SPREADSHEET_ID: 1heSkaWrqIRfKxJnHvWP-kYdK9YbZEak07lSPuVyjO44
          NEWS_SHEET_NAME: News Pipeline
          NEWS_DRY_RUN: "false"
          NEWS_GENERATE: ${{ github.event_name == 'schedule' || inputs.mode == 'full' }}
          NEWS_GENERATE_IMAGES: "true"
          NEWS_REQUIRE_IMAGE: "true"
          GEMINI_IMAGE_MODEL: gemini-2.5-flash-image
          WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
          WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
          WORDPRESS_APP_PASSWORD: ${{ secrets.WORDPRESS_APP_PASSWORD }}

