],"ar":["من نحن","استوديو البعد الرابع هو استوديو متعدد التخصصات يعمل في العمارة والذكاء الاصطناعي والتصميم الرقمي والموشن والأتمتة. نربط التصميم المكاني بالتقنية والسرد البصري للمشاريع الدولية.","منهجنا","يمر كل مشروع بالبحث وتحديد المشكلة والتصميم والمراجعة البشرية للجودة والتسليم الشفاف."]},"contact":{"fa":["تماس با ما","برای همکاری، سفارش پروژه، سؤال درباره محتوا یا درخواست مربوط به حریم خصوصی از ایمیل زیر استفاده کنید.","ایمیل","hello@fourthdimension.studio"],"en":["Contact Us","For collaborations, project enquiries, content questions or privacy requests, use the email below.","Email","hello@fourthdimension.studio"],"ar":["اتصل بنا","للتعاون أو طلب مشروع أو الأسئلة المتعلقة بالمحتوى أو الخصوصية، استخدم البريد الإلكتروني أدناه.","البريد الإلكتروني","hello@fourthdimension.studio"]},"privacy":{"fa":["سیاست حریم خصوصی","ما فقط اطلاعاتی را پردازش می‌کنیم که برای پاسخ‌گویی، ارائه خدمات، امنیت و تعهدات قانونی لازم است. اطلاعات شخصی فروخته نمی‌شود. هاست، ایمیل، تحلیل و پرداخت در صورت فعال‌شدن ممکن است دادهٔ محدودی را طبق سیاست خود پردازش کنند.","حقوق شما","می‌توانید درخواست دسترسی، اصلاح یا حذف داده‌های خود را از طریق ایمیل تماس ارسال کنید. ابزارهای مرورگری سایت برای پردازش محلی طراحی شده‌اند، اما برای فایل‌های محرمانه ابتدا توضیح همان ابزار را بررسی کنید."],"en":["Privacy Policy","We process only information needed to answer enquiries, deliver services, maintain security and meet legal obligations. Personal information is not sold. Hosting, email, analytics and payment providers may process limited data under their own policies when enabled.","Your rights","You may request access, correction or deletion through our contact email. Browser-based tools are designed for local processing, but review each tool notice before using confidential files."],"ar":["سياسة الخصوصية","نعالج فقط المعلومات اللازمة للرد على الاستفسارات وتقديم الخدمات والحفاظ على الأمان والوفاء بالالتزامات القانونية. لا نبيع المعلومات الشخصية. قد يعالج مزودو الاستضافة والبريد والتحليلات والدفع بيانات محدودة وفق سياساتهم عند التفعيل.","حقوقك","يمكنك طلب الوصول أو التصحيح أو الحذف عبر بريد التواصل. صُممت أدوات المتصفح للمعالجة المحلية، لكن راجع إشعار كل أداة قبل استخدام ملفات سرية."]},"terms":{"fa":["شرایط و ضوابط","با استفاده از سایت موافقت می‌کنید که آن را قانونی و بدون اخلال در امنیت یا دسترسی دیگران به‌کار ببرید. محتوا، هویت بصری، آثار و کدهای اصلی تحت قوانین مالکیت فکری محفوظ‌اند مگر خلاف آن ذکر شود.","خدمات و مسئولیت","شروع پروژه منوط به توافق کتبی درباره دامنه، زمان، هزینه و حقوق استفاده است. ابزارهای رایگان بدون تضمین و برای راحتی ارائه می‌شوند؛ خروجی‌ها را بررسی و نسخهٔ اصلی فایل‌ها را نگهداری کنید."],"en":["Terms and Conditions","By using this site, you agree to use it lawfully and without interfering with security or other users. Original content, identity, artwork and code remain protected unless stated otherwise.","Services and responsibility","A project starts only after written agreement on scope, timing, fees and usage rights. Free tools are provided for convenience without warranty; verify outputs and keep original files."],"ar":["الشروط والأحكام","باستخدام الموقع توافق على استخدامه بصورة قانونية دون الإضرار بالأمان أو بالمستخدمين. يظل المحتوى والهوية والأعمال والبرمجيات الأصلية محمية ما لم يذكر خلاف ذلك.","الخدمات والمسؤولية","يبدأ المشروع بعد اتفاق مكتوب على النطاق والوقت والرسوم وحقوق الاستخدام. تُقدم الأدوات المجانية للتسهيل دون ضمان؛ تحقق من النتائج واحتفظ بالملفات الأصلية."]},"cookies":{"fa":["سیاست کوکی","سایت ممکن است از ذخیره‌سازی ضروری برای انتخاب زبان، امنیت و عملکرد اصلی استفاده کند. کوکی‌های تحلیل، تبلیغات یا پروفایل‌سازی غیرضروری تا پیش از ارائه سازوکار رضایت فعال نمی‌شوند.","انتخاب شما","می‌توانید کوکی‌ها را در مرورگر حذف یا مسدود کنید؛ مسدودکردن ذخیره‌سازی ضروری ممکن است زبان یا قابلیت‌های سایت را مختل کند."],"en":["Cookie Policy","The site may use essential storage for language preference, security and core functionality. Non-essential analytics, advertising or profiling cookies will not be enabled before an appropriate consent mechanism is available.","Your choice","You may remove or block cookies in your browser; blocking essential storage may affect language or site functionality."],"ar":["سياسة ملفات تعريف الارتباط","قد يستخدم الموقع تخزيناً ضرورياً لاختيار اللغة والأمان والوظائف الأساسية. لن تُفعّل ملفات التحليلات أو الإعلانات غير الضرورية قبل توفير آلية موافقة مناسبة.","اختيارك","يمكنك حذف ملفات الارتباط أو حظرها في المتصفح؛ وقد يؤثر حظر التخزين الضروري في اللغة أو وظائف الموقع."]},"editorial":{"fa":["سیاست تحریریه","اخبار و مقالات باید منبع معتبر، تاریخ، نویسنده یا سازمان اصلی و لینک مرجع داشته باشند. خبر، مقاله، تبلیغ و محتوای وابسته از هم جدا نگه داشته می‌شوند. کپی یا بازنویسی سطحی پذیرفته نیست.","اصلاحات و تأیید","محتوای خودکار پیش از انتشار توسط انسان بررسی می‌شود. خطاهای مهم به‌صورت شفاف اصلاح می‌شوند و خبر تأییدنشده یا تکراری منتشر نمی‌شود."],"en":["Editorial Policy","News and articles must identify credible sources, dates, original authors or organisations and reference links. News, analysis, advertising and affiliate content remain clearly separated. Copying or superficial rewriting is not accepted.","Corrections and approval","Automated content receives human review before publication. Material errors are corrected transparently, and unverified or duplicate news is rejected."],"ar":["السياسة التحريرية","يجب أن تتضمن الأخبار والمقالات مصادر موثوقة وتواريخ والكاتب أو المؤسسة الأصلية وروابط المراجع. نفصل بوضوح بين الأخبار والتحليل والإعلان والمحتوى التابع. لا نقبل النسخ أو إعادة الصياغة السطحية.","التصحيحات والموافقة","تخضع المواد الآلية لمراجعة بشرية قبل النشر. تُصحح الأخطاء المهمة بشفافية وتُرفض الأخبار غير الموثقة أو المكررة."]},"ai":{"fa":["سیاست محتوای هوش مصنوعی","ممکن است از هوش مصنوعی برای تحقیق اولیه، ایده‌پردازی، ترجمه، پیش‌نویس و تصویرسازی استفاده شود؛ اما مسئولیت انتخاب منابع، کنترل واقعیت و انتشار با انسان است.","شفافیت و محدودیت","محتوای AI نباید جعل منبع، نقض حریم خصوصی یا ادعای تخصص حرفه‌ای ایجاد کند. خروجی معماری یا فنی جایگزین نقشه اجرایی، محاسبه مهندسی یا مشاوره تخصصی نیست."],"en":["AI Content Policy","AI may assist early research, ideation, translation, drafting and imagery, but source selection, fact-checking and publication remain under human responsibility.","Transparency and limits","AI content must not fabricate sources, violate privacy or imply professional certification. Architectural or technical output does not replace construction documents, engineering calculations or qualified advice."],"ar":["سياسة محتوى الذكاء الاصطناعي","قد يساعد الذكاء الاصطناعي في البحث الأولي والأفكار والترجمة والمسودات والصور، لكن اختيار المصادر والتحقق والنشر مسؤولية بشرية.","الشفافية والحدود","يجب ألا يختلق محتوى الذكاء الاصطناعي مصادر أو ينتهك الخصوصية أو يوحي باعتماد مهني. لا يحل الناتج المعماري أو التقني محل وثائق التنفيذ أو الحسابات الهندسية أو المشورة المتخصصة."]},"images":{"fa":["سیاست حقوق تصاویر","برای تصاویر از آثار تولیدی استودیو، منابع دارای مجوز، محتوای عمومی مجاز یا تصویرسازی هوش مصنوعی استفاده می‌شود. نام منبع، پدیدآورنده و نوع مجوز در صورت نیاز در کپشن یا فراداده ثبت می‌شود.","گزارش حق نشر","اگر صاحب حقی هستید و استفاده‌ای را نادرست می‌دانید، لینک صفحه و مدرک مالکیت را ایمیل کنید تا بررسی و در صورت لزوم اصلاح یا حذف شود."],"en":["Image Copyright Policy","Images are sourced from studio originals, appropriately licensed sources, permitted public material or AI-assisted creation. Source, creator and licence details are credited in captions or metadata where required.","Copyright notices","If you own rights and believe an image is used incorrectly, email the page link and proof of ownership for review, correction or removal where appropriate."],"ar":["سياسة حقوق الصور","نستخدم صور الاستوديو الأصلية أو المصادر المرخصة أو المواد العامة المسموح بها أو الصور المنتجة بمساعدة الذكاء الاصطناعي. نذكر المصدر والمبدع والترخيص في التعليق أو البيانات الوصفية عند الحاجة.","بلاغات الحقوق","إذا كنت صاحب حق وتعتقد أن صورة استُخدمت بصورة غير صحيحة، أرسل رابط الصفحة وإثبات الملكية للمراجعة والتصحيح أو الإزالة عند الاقتضاء."]},"affiliate":{"fa":["افشای همکاری در فروش","ممکن است بعضی لینک‌ها وابسته باشند و در صورت خرید، بدون هزینهٔ اضافه برای شما کمیسیون ایجاد کنند. چنین لینک‌هایی به‌وضوح علامت‌گذاری می‌شوند.","استقلال تحریریه","دریافت کمیسیون تضمین‌کنندهٔ معرفی مثبت نیست و در انتخاب یا ارزیابی تحریریه دخالت ندارد. در حال حاضر هر برنامهٔ فعال باید کنار همان لینک اعلام شود."],"en":["Affiliate Disclosure","Some links may be affiliate links that can earn a commission at no additional cost to you. Such links will be clearly labelled.","Editorial independence","A commission never guarantees positive coverage and does not control editorial selection or evaluation. Any active programme must be disclosed beside the relevant link."],"ar":["إفصاح الروابط التابعة","قد تكون بعض الروابط تابعة وتحقق عمولة دون تكلفة إضافية عليك. ستوضع علامة واضحة على هذه الروابط.","الاستقلال التحريري","لا تضمن العمولة تغطية إيجابية ولا تتحكم في الاختيار أو التقييم التحريري. يجب الإفصاح عن أي برنامج نشط بجوار الرابط المعني."]}},N={fa:{about:'درباره ما',contact:'تماس',privacy:'حریم خصوصی',terms:'شرایط و ضوابط',cookies:'کوکی‌ها',editorial:'سیاست تحریریه',ai:'سیاست محتوای AI',images:'حقوق تصاویر',affiliate:'افشای همکاری در فروش',effective:'به‌روزرسانی: ۴ اکتبر ۲۰۲۶',note:'این متن برای شفافیت عمومی تهیه شده و جایگزین مشاوره حقوقی ویژه کشور محل ثبت کسب‌وکار نیست.'},en:{about:'About',contact:'Contact',privacy:'Privacy',terms:'Terms & Conditions',cookies:'Cookies',editorial:'Editorial Policy',ai:'AI Content Policy',images:'Image Copyright',affiliate:'Affiliate Disclosure',effective:'Updated: 4 October 2026',note:'This transparency text is general information and not a substitute for jurisdiction-specific legal advice.'},ar:{about:'من نحن',contact:'اتصل بنا',privacy:'الخصوصية',terms:'الشروط والأحكام',cookies:'ملفات الارتباط',editorial:'السياسة التحريرية',ai:'سياسة محتوى AI',images:'حقوق الصور',affiliate:'إفصاح الروابط التابعة',effective:'آخر تحديث: 4 أكتوبر 2026',note:'هذا النص للشفافية العامة ولا يحل محل المشورة القانونية الخاصة ببلد تسجيل النش
