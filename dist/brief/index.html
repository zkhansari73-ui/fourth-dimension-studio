<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Project Brief — Fourth Dimension Studio</title><meta name="description" content="Prepare a project brief for Fourth Dimension Studio."><meta name="robots" content="index,follow"><link rel="stylesheet" href="../legal/legal.css"><style>form{display:grid;gap:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}label{display:grid;gap:7px;color:#ddd}input,select,textarea{width:100%;padding:13px;border:1px solid #ffffff22;border-radius:10px;background:#0d1015;color:#fff;font:inherit}textarea{min-height:150px}button{padding:14px 20px;border:0;border-radius:99px;background:#f2a34b;color:#17100a;font-weight:700;cursor:pointer}.consent{display:flex;align-items:flex-start;gap:10px}.consent input{width:auto;margin-top:7px}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header><a href="../index.html">← Fourth Dimension Studio</a></header><main><p class="updated">PROJECT ENQUIRY</p><h1>Tell us what you want to build.</h1><p>This form prepares an email in your own mail app. Your answers are not uploaded to this website.</p><form id="briefForm"><div class="grid"><label>Name<input name="name" required autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label></div><label>Service<select name="service" required><option value="">Choose a service</option><option>Architecture & BIM</option><option>AI & Content Creation</option><option>Teasers & Motion</option><option>Website & App Design</option><option>Automation & AI Agents</option><option>Articles & Books</option></select></label><div class="grid"><label>Estimated budget<input name="budget" placeholder="Currency and range"></label><label>Preferred timeline<input name="timeline" placeholder="Target date or duration"></label></div><label>Project goals, scope and required deliverables<textarea name="details" required></textarea></label><label>Reference link (optional)<input name="reference" type="url" placeholder="https://"></label><label class="consent"><input name="consent" type="checkbox" required><span>I agree that the information I include can be used to answer this enquiry. I have read the <a href="../legal/privacy.html">Privacy Policy</a>.</span></label><button type="submit">Prepare email →</button></form></main><footer><a href="../legal/privacy.html">Privacy</a> · <a href="../legal/terms.html">Terms</a></footer><script>document.getElementById('briefForm').addEventListener('submit',event=>{event.preventDefault();const data=new FormData(event.currentTarget);const subject='Project brief — '+data.get('service');const body=['Name: '+data.get('name'),'Email: '+data.get('email'),'Service: '+data.get('service'),'Budget: '+data.get('budget'),'Timeline: '+data.get('timeline'),'Reference: '+data.get('reference'),'','Project details:',''+data.get('details')].join('\n');location.href='mailto:hello@fourthdimension.studio?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)})</script></body></html>
